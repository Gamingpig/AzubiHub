<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Azubi Hub - Local Edition</title>
    
    <!-- Tailwind CSS (Design) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM (Logik) -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel (Übersetzer für den Browser) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; }
        .animate-pulse-slow { animation: pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes pulse {
            0%, 100% { opacity: 0.2; }
            50% { opacity: 0.1; }
        }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Animation für die Notifications */
        @keyframes slideIn {
            from { transform: translate(-50%, -100%); opacity: 0; }
            to { transform: translate(-50%, 0); opacity: 1; }
        }
        .toast-enter { animation: slideIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
    </style>
</head>
<body class="bg-slate-950 text-white">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // --- ICONS (SVG Pfade direkt im Code für Unabhängigkeit) ---
        const Icons = {
            Activity: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>,
            Zap: ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>,
            CloudRain: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"/><path d="M16 14v6"/><path d="M8 14v6"/><path d="M12 16v6"/></svg>,
            Coffee: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17 8h1a4 4 0 1 1 0 8h-1"/><path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4Z"/><line x1="6" x2="6" y1="2" y2="4"/><line x1="10" x2="10" y1="2" y2="4"/><line x1="14" x2="14" y1="2" y2="4"/></svg>,
            Plus: ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>,
            Trash2: ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></svg>,
            ExternalLink: ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" x2="21" y1="14" y2="3"/></svg>,
            Users: ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>,
            MessageSquare: ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>,
            Lock: ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>,
            LayoutGrid: ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></svg>,
            GraduationCap: ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>,
            Briefcase: ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="20" height="14" x="2" y="7" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>,
            Wrench: ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>,
            Heart: ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>,
            X: ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M18 6 6 18"/><path d="m6 6 18 18"/></svg>,
            Info: ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="16" y2="12"/><line x1="12" x2="12.01" y1="8" y2="8"/></svg>,
            Brain: ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96.44 2.5 2.5 0 0 1-2.96-3.08 3 3 0 0 1-.34-5.58 2.5 2.5 0 0 1 1.32-4.24 2.5 2.5 0 0 1 1.98-3A2.5 2.5 0 0 1 9.5 2Z"/><path d="M14.5 2A2.5 2.5 0 0 0 12 4.5v15a2.5 2.5 0 0 0 4.96.44 2.5 2.5 0 0 0 2.96-3.08 3 3 0 0 0 .34-5.58 2.5 2.5 0 0 0-1.32-4.24 2.5 2.5 0 0 0-1.98-3A2.5 2.5 0 0 0 14.5 2Z"/></svg>,
            Rocket: ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/><path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/><path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"/><path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/></svg>
        };

        const DISCORD_INVITE_LINK = 'https://discord.gg/TEjJbrGwbg';

        // --- WISSENSDATENBANK (Statisch) ---
        const STATIC_TOOLS = {
            // AI & Tech
            'gemini': 'https://gemini.google.com',
            'chatgpt': 'https://chatgpt.com',
            'notebooklm': 'https://notebooklm.google.com',
            'perplexity': 'https://perplexity.ai',
            'github': 'https://github.com',
            'gitlab': 'https://gitlab.com',
            'stackoverflow': 'https://stackoverflow.com',
            'mdn': 'https://developer.mozilla.org',
            'w3schools': 'https://www.w3schools.com',
            'vscode': 'https://code.visualstudio.com',
            'react': 'https://react.dev',
            'tailwind': 'https://tailwindcss.com',
            'discord': 'https://discord.com',
            'slack': 'https://slack.com',
            'teams': 'https://teams.microsoft.com',
            'outlook': 'https://outlook.office.com',
            'trello': 'https://trello.com',
            'jira': 'https://www.atlassian.com/software/jira',
            'notion': 'https://www.notion.so',
            'zoom': 'https://zoom.us',
            'canva': 'https://www.canva.com',
            'figma': 'https://www.figma.com',
            'adobe': 'https://www.adobe.com',
            'moodle': 'https://moodle.org',
            'iserv': 'https://iserv.eu',
            'webuntis': 'https://webuntis.com',
            'studyflix': 'https://studyflix.de',
            'simpleclub': 'https://simpleclub.com',
            'leifiphysik': 'https://www.leifiphysik.de',
            'ihk': 'https://www.ihk.de',
            'wikipedia': 'https://de.wikipedia.org',
            'youtube': 'https://www.youtube.com',
            'google': 'https://google.de',
            'maps': 'https://maps.google.com',
            'spotify': 'https://open.spotify.com'
        };

        // --- COMPONENTS ---
        
        const TutorialModal = ({ onClose }) => {
            const [countdown, setCountdown] = useState(5);
            
            useEffect(() => {
                if (countdown > 0) {
                    const timer = setTimeout(() => setCountdown(c => c - 1), 1000);
                    return () => clearTimeout(timer);
                }
            }, [countdown]);

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm animate-in fade-in duration-300">
                    <div className="bg-slate-900 border border-blue-500/30 p-8 rounded-3xl max-w-lg w-full shadow-2xl shadow-blue-900/20 transform transition-all scale-100 relative overflow-hidden">
                        <div className="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-blue-500 via-purple-500 to-blue-500"></div>
                        <div className="flex items-start gap-4 mb-6">
                            <div className="p-3 bg-blue-500/20 rounded-2xl text-blue-400">
                                <Icons.Brain className="w-8 h-8" />
                            </div>
                            <div>
                                <h2 className="text-2xl font-bold text-white mb-2">Offline & Brain-Mode! 🧠</h2>
                                <p className="text-slate-300 leading-relaxed text-sm">
                                    Moin Jonas! Ich habe das System umgebaut.
                                    <br/><br/>
                                    <strong>1. Lokal & Privat:</strong><br/>
                                    Deine Links werden jetzt <strong>nur in diesem Browser</strong> gespeichert. Kein Server, keine Cloud. Alles sicher bei dir.
                                    <br/><br/>
                                    <strong>2. Lernfähigkeit:</strong><br/>
                                    Das Hub merkt sich weiterhin deine neuen Links und füllt sie beim nächsten Mal automatisch aus.
                                </p>
                            </div>
                        </div>
                        <button onClick={onClose} disabled={countdown > 0} className={`w-full py-4 rounded-xl font-bold text-lg transition-all relative overflow-hidden ${countdown > 0 ? 'bg-slate-800 text-slate-500 cursor-not-allowed' : 'bg-blue-600 hover:bg-blue-500 text-white shadow-lg shadow-blue-500/20 hover:scale-[1.02] active:scale-95'}`}>
                            {countdown > 0 ? <span>Lies kurz... ({countdown}s)</span> : <span>Alles klar, lokal speichern! 💾</span>}
                            {countdown > 0 && <div className="absolute bottom-0 left-0 h-1 bg-blue-500 transition-all duration-1000 ease-linear" style={{ width: `${(countdown / 5) * 100}%` }}></div>}
                        </button>
                    </div>
                </div>
            );
        };

        const NotificationToast = ({ message }) => {
            return (
                <div className="fixed top-6 left-1/2 transform -translate-x-1/2 z-50 toast-enter">
                    <div className="bg-slate-800/90 backdrop-blur-md border border-green-500/30 text-white px-6 py-4 rounded-2xl shadow-2xl flex items-center gap-3">
                        <div className="bg-green-500/20 p-2 rounded-full text-green-400">
                            <Icons.Rocket className="w-5 h-5" />
                        </div>
                        <span className="font-bold text-sm sm:text-base">{message}</span>
                    </div>
                </div>
            );
        };

        const App = () => {
            // --- STATE ---
            const [name, setName] = useState('');
            const [hasName, setHasName] = useState(false);
            
            // Links direkt aus LocalStorage laden
            const [links, setLinks] = useState([]);
            
            const [currentMood, setCurrentMood] = useState('neutral');
            const [isDynamicTheme, setIsDynamicTheme] = useState(true);
            const [welcomeMsg, setWelcomeMsg] = useState('');
            const [showTutorial, setShowTutorial] = useState(false);
            const [notification, setNotification] = useState(null);
            
            // Form State
            const [newLinkUrl, setNewLinkUrl] = useState('');
            const [newLinkTitle, setNewLinkTitle] = useState('');
            const [newLinkCategory, setNewLinkCategory] = useState('school');
            const [activeCategory, setActiveCategory] = useState('all');
            const [autoFilled, setAutoFilled] = useState(false);
            const [learnedText, setLearnedText] = useState('');

            // Learned Tools from LocalStorage
            const [learnedTools, setLearnedTools] = useState({});

            const moods = {
                neutral: { label: 'Neutral', icon: <Icons.Activity />, bg: 'bg-slate-950', accent: 'text-blue-400', glass: 'bg-slate-900/60 border-slate-800', btn: 'bg-blue-600 hover:bg-blue-500 shadow-blue-900/20', blob1: 'bg-blue-600', blob2: 'bg-purple-600' },
                hype: { label: 'Hype', icon: <Icons.Zap />, bg: 'bg-indigo-950', accent: 'text-yellow-400', glass: 'bg-indigo-900/40 border-indigo-500/30', btn: 'bg-gradient-to-r from-pink-600 to-yellow-500 hover:scale-105 shadow-pink-900/20', blob1: 'bg-pink-500', blob2: 'bg-yellow-500' },
                stressed: { label: 'Gestresst', icon: <Icons.CloudRain />, bg: 'bg-teal-950', accent: 'text-teal-200', glass: 'bg-teal-900/30 border-teal-500/20', btn: 'bg-teal-700 hover:bg-teal-600 shadow-teal-900/20', blob1: 'bg-teal-600', blob2: 'bg-emerald-800' },
                tired: { label: 'Müde', icon: <Icons.Coffee />, bg: 'bg-stone-950', accent: 'text-orange-200', glass: 'bg-stone-900/60 border-stone-800', btn: 'bg-orange-800 hover:bg-orange-700 shadow-orange-900/20', blob1: 'bg-stone-700', blob2: 'bg-orange-900' }
            };

            const categories = [
                { id: 'all', label: 'Alle', icon: <Icons.LayoutGrid className="w-4 h-4"/> },
                { id: 'school', label: 'Berufsschule', icon: <Icons.GraduationCap className="w-4 h-4"/> },
                { id: 'work', label: 'Betrieb', icon: <Icons.Briefcase className="w-4 h-4"/> },
                { id: 'tools', label: 'Tools', icon: <Icons.Wrench className="w-4 h-4"/> },
                { id: 'other', label: 'Sonstiges', icon: <Icons.Heart className="w-4 h-4"/> },
            ];

            // --- INITIAL LOAD ---
            useEffect(() => {
                // Namen laden
                const savedName = localStorage.getItem('azubi_name');
                if (savedName) {
                    setName(savedName);
                    setHasName(true);
                }

                // Links laden
                try {
                    const savedLinks = JSON.parse(localStorage.getItem('azubi_links') || '[]');
                    // Sortieren nach Zeit (neueste zuerst) wenn vorhanden, sonst einfach so lassen
                    setLinks(savedLinks.sort((a,b) => b.createdAt - a.createdAt));
                } catch (e) {
                    console.error("Fehler beim Laden der Links", e);
                    setLinks([]);
                }

                // Gelernte Tools laden
                try {
                    const savedTools = JSON.parse(localStorage.getItem('azubi_learned_tools') || '{}');
                    setLearnedTools(savedTools);
                } catch (e) {
                    setLearnedTools({});
                }

                // Tutorial check
                const seenTutorial = localStorage.getItem('azubi_tutorial_seen_local');
                if (!seenTutorial && savedName) {
                    setShowTutorial(true);
                }
            }, []);

            const getRandomGreeting = (n, m) => {
                const list = {
                    neutral: [`Willkommen zurück, ${n}!`, `Alles klar, ${n}?`, `Moin ${n}, let's go!`],
                    hype: [`Yo ${n}, reiß die Hütte ab!`, `Volle Energie, ${n}! 🚀`, `Lets go, ${n}!`],
                    stressed: [`Tief durchatmen, ${n}.`, `Eins nach dem anderen, ${n}.`, `Du packst das, ${n}.`],
                    tired: [`Erstmal Kaffee, ${n}? ☕`, `Augen auf, ${n}!`, `Power nap später, ${n}?`]
                };
                const opts = list[m] || list.neutral;
                return opts[Math.floor(Math.random() * opts.length)];
            };

            useEffect(() => {
                if (hasName) setWelcomeMsg(getRandomGreeting(name, currentMood));
            }, [hasName, currentMood, name]);

            // --- ACTIONS ---

            const handleNameSubmit = (e) => {
                e.preventDefault();
                if (name.trim()) {
                    localStorage.setItem('azubi_name', name);
                    setHasName(true);
                    if (!localStorage.getItem('azubi_tutorial_seen_local')) setShowTutorial(true);
                }
            };

            const closeTutorial = () => {
                localStorage.setItem('azubi_tutorial_seen_local', 'true');
                setShowTutorial(false);
            };

            const handleTitleChange = (e) => {
                const val = e.target.value;
                setNewLinkTitle(val);
                
                const lowerVal = val.trim().toLowerCase();
                const allKnowledge = { ...STATIC_TOOLS, ...learnedTools };

                if (allKnowledge[lowerVal]) {
                    setNewLinkUrl(allKnowledge[lowerVal]);
                    // Simple auto-cat
                    if (['github','vscode','react','tailwind'].some(k => lowerVal.includes(k))) setNewLinkCategory('tools');
                    else if (['moodle','iserv','studyflix','webuntis'].some(k => lowerVal.includes(k))) setNewLinkCategory('school');
                    else setNewLinkCategory('tools');

                    setAutoFilled(true);
                    setTimeout(() => setAutoFilled(false), 3000);
                }
            };

            const handleAddLink = (e) => {
                e.preventDefault();
                if (!newLinkTitle || !newLinkUrl) return;
                
                let finalUrl = newLinkUrl;
                if (!/^https?:\/\//i.test(finalUrl)) finalUrl = 'https://' + finalUrl;

                const newLink = {
                    id: Date.now().toString(), // Simple ID
                    title: newLinkTitle,
                    url: finalUrl,
                    category: newLinkCategory,
                    createdAt: Date.now()
                };

                // 1. State Update (Neue Links oben)
                const updatedLinks = [newLink, ...links];
                setLinks(updatedLinks);
                
                // 2. LocalStorage Update
                localStorage.setItem('azubi_links', JSON.stringify(updatedLinks));

                // 3. Learning
                const lowerTitle = newLinkTitle.trim().toLowerCase();
                if (!STATIC_TOOLS[lowerTitle] && finalUrl) {
                    if (learnedTools[lowerTitle] !== finalUrl) {
                        const newLearned = { ...learnedTools, [lowerTitle]: finalUrl };
                        setLearnedTools(newLearned);
                        localStorage.setItem('azubi_learned_tools', JSON.stringify(newLearned));
                        
                        setLearnedText('Gelernt! 🧠');
                        setTimeout(() => setLearnedText(''), 3000);
                    }
                }

                setNewLinkTitle(''); 
                setNewLinkUrl('');

                setNotification('Lokal gespeichert! Ab nach oben... 🚀');
                window.scrollTo({ top: 0, behavior: 'smooth' });
                setTimeout(() => setNotification(null), 4000);
            };

            const handleDelete = (id) => {
                const updatedLinks = links.filter(l => l.id !== id);
                setLinks(updatedLinks);
                localStorage.setItem('azubi_links', JSON.stringify(updatedLinks));
            };

            // --- RENDER ---
            const theme = moods[currentMood];
            const activeThemeBg = isDynamicTheme ? theme.bg : 'bg-slate-950';
            const filteredLinks = activeCategory === 'all' ? links : links.filter(l => l.category === activeCategory);

            if (!hasName) {
                return (
                    <div className="min-h-screen bg-slate-950 flex items-center justify-center p-4 overflow-hidden relative font-sans text-white">
                        <div className="absolute top-[-10%] left-[-10%] w-[500px] h-[500px] bg-blue-600/20 rounded-full blur-[120px]"></div>
                        <div className="max-w-md w-full bg-slate-900/50 backdrop-blur-xl border border-slate-800 p-8 rounded-2xl shadow-2xl z-10">
                            <h1 className="text-3xl font-bold mb-2 text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-purple-400">Azubi Hub Setup</h1>
                            <p className="text-slate-400 mb-6">Moin! Wie sollen wir dich nennen?</p>
                            <form onSubmit={handleNameSubmit} className="space-y-4">
                                <input type="text" value={name} onChange={e=>setName(e.target.value)} placeholder="Dein Name..." className="w-full bg-black/20 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:ring-2 focus:ring-blue-500" autoFocus />
                                <button type="submit" disabled={!name.trim()} className="w-full bg-blue-600 hover:bg-blue-500 py-3 rounded-xl font-bold text-white shadow-lg shadow-blue-500/20 transition-all disabled:opacity-50">Lokal Starten 🚀</button>
                            </form>
                        </div>
                    </div>
                );
            }

            return (
                <div className={`min-h-screen transition-colors duration-700 ease-in-out ${activeThemeBg} text-white selection:bg-white/20 overflow-x-hidden font-sans`}>
                    
                    {showTutorial && <TutorialModal onClose={closeTutorial} />}
                    {notification && <NotificationToast message={notification} />}

                    {isDynamicTheme && (
                        <div className="fixed inset-0 pointer-events-none overflow-hidden" style={{zIndex:0}}>
                            <div className={`absolute top-[-20%] left-[-10%] w-[60vw] h-[60vw] rounded-full blur-[120px] opacity-20 transition-colors duration-1000 animate-pulse-slow ${theme.blob1}`}></div>
                            <div className={`absolute bottom-[-10%] right-[-10%] w-[50vw] h-[50vw] rounded-full blur-[120px] opacity-20 transition-colors duration-1000 animate-pulse-slow delay-1000 ${theme.blob2}`}></div>
                        </div>
                    )}

                    <div className="relative z-10 max-w-7xl mx-auto p-4 sm:p-6 lg:p-8">
                        
                        {/* Header */}
                        <header className="flex flex-col md:flex-row justify-between items-start md:items-end mb-8 gap-6 border-b border-white/5 pb-8">
                            <div className="w-full md:w-auto">
                                <div className="flex justify-between items-center md:block">
                                    <div className={`inline-flex items-center gap-2 px-3 py-1 rounded-full text-xs font-medium mb-3 border ${theme.glass} ${theme.accent}`}>
                                        <Icons.Lock className="w-3 h-3" /> <span>Local Storage (Privat)</span>
                                    </div>
                                    <button onClick={() => setIsDynamicTheme(!isDynamicTheme)} className="md:hidden p-2 rounded-full bg-white/5 border border-white/10">
                                        {isDynamicTheme ? <Icons.Zap className="w-4 h-4 text-yellow-400"/> : <Icons.Zap className="w-4 h-4 text-slate-500"/>}
                                    </button>
                                </div>
                                <h1 className="text-4xl md:text-6xl font-black tracking-tighter mb-2 leading-tight">
                                    <span className="block text-transparent bg-clip-text bg-gradient-to-br from-white to-white/60">{welcomeMsg}</span>
                                </h1>
                                <p className="text-white/40 text-sm font-mono">USER: {name.toUpperCase()} // MODE: {currentMood.toUpperCase()}</p>
                            </div>
                            <div className="flex flex-col items-end gap-3 w-full md:w-auto">
                                <button onClick={() => setIsDynamicTheme(!isDynamicTheme)} className="hidden md:flex items-center gap-2 text-xs font-bold uppercase tracking-widest text-white/40 hover:text-white mb-2">
                                    <div className={`w-8 h-4 rounded-full p-0.5 transition-colors ${isDynamicTheme ? 'bg-green-500' : 'bg-slate-700'}`}>
                                        <div className={`h-3 w-3 bg-white rounded-full shadow-sm transition-transform ${isDynamicTheme ? 'translate-x-4' : 'translate-x-0'}`}></div>
                                    </div>
                                    Dynamic Vibes
                                </button>
                                {isDynamicTheme && (
                                    <div className={`p-1 rounded-2xl flex flex-wrap justify-end gap-1 backdrop-blur-md border ${theme.glass}`}>
                                        {Object.entries(moods).map(([key, m]) => (
                                            <button key={key} onClick={() => setCurrentMood(key)} className={`relative px-4 py-2 rounded-xl text-sm font-medium transition-all duration-200 flex items-center gap-2 ${currentMood === key ? 'bg-white/10 shadow-inner text-white ring-1 ring-white/10' : 'text-white/40 hover:text-white hover:bg-white/5'}`}>
                                                {m.icon} <span className="hidden sm:inline">{m.label}</span>
                                            </button>
                                        ))}
                                    </div>
                                )}
                            </div>
                        </header>

                        <div className="grid grid-cols-1 lg:grid-cols-12 gap-8">
                            
                            {/* Sidebar: Input & Support */}
                            <div className="lg:col-span-4 space-y-6">
                                <div className={`p-6 rounded-3xl backdrop-blur-md border shadow-2xl ${isDynamicTheme ? theme.glass : 'bg-slate-900 border-slate-800'}`}>
                                    <h2 className="text-lg font-bold mb-4 flex items-center gap-2 text-white/90"><Icons.Plus className="w-5 h-5 text-green-400" /> Link adden</h2>
                                    <form onSubmit={handleAddLink} className="space-y-4 relative">
                                        <div className="relative">
                                            <input type="text" required value={newLinkTitle} onChange={handleTitleChange} placeholder="Titel (z.B. Studyflix)" className="w-full bg-black/20 border border-white/5 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-white/20 transition-colors" />
                                            {autoFilled && <span className="absolute right-3 top-3 text-green-400 text-xs font-bold animate-pulse">Gefunden! ✨</span>}
                                            {learnedText && <span className="absolute right-3 top-3 text-blue-400 text-xs font-bold animate-bounce">{learnedText}</span>}
                                        </div>
                                        <input type="text" required value={newLinkUrl} onChange={e => setNewLinkUrl(e.target.value)} placeholder="URL" className={`w-full bg-black/20 border rounded-xl px-4 py-3 text-sm text-white focus:outline-none transition-all duration-500 ${autoFilled ? 'border-green-500/50 bg-green-900/10' : 'border-white/5'}`} />
                                        <div className="relative">
                                            <select value={newLinkCategory} onChange={e => setNewLinkCategory(e.target.value)} className="w-full bg-black/20 border border-white/5 rounded-xl px-4 py-3 text-sm text-white appearance-none cursor-pointer">
                                                {categories.filter(c => c.id !== 'all').map(cat => <option key={cat.id} value={cat.id} className="bg-slate-900">{cat.label}</option>)}
                                            </select>
                                            <div className="absolute right-4 top-3.5 pointer-events-none opacity-50">🔽</div>
                                        </div>
                                        <button type="submit" className={`w-full py-3 rounded-xl font-bold shadow-lg mt-2 text-white flex items-center justify-center gap-2 ${theme.btn}`}>Lokal Speichern <Icons.Lock className="w-3 h-3 opacity-50"/></button>
                                    </form>
                                </div>

                                <div className={`p-6 rounded-3xl backdrop-blur-md border shadow-xl flex flex-col items-center text-center gap-4 ${isDynamicTheme ? theme.glass : 'bg-slate-900 border-slate-800'}`}>
                                    <div className="w-14 h-14 rounded-full bg-[#5865F2]/20 flex items-center justify-center text-[#5865F2] mb-1"><Icons.Users className="w-7 h-7" /></div>
                                    <div><h3 className="font-bold text-lg">Support</h3><p className="text-xs text-white/50 mt-1">Komm auf den Server!</p></div>
                                    <a href={DISCORD_INVITE_LINK} target="_blank" rel="noopener noreferrer" className="px-6 py-3 bg-[#5865F2] hover:bg-[#4752C4] text-white rounded-xl font-bold text-sm w-full flex items-center justify-center gap-2"><Icons.MessageSquare className="w-4 h-4"/> Server beitreten</a>
                                </div>
                            </div>

                            {/* Main Content: Links */}
                            <div className="lg:col-span-8">
                                <div className="flex items-center gap-2 mb-6 overflow-x-auto pb-2 scrollbar-hide">
                                    {categories.map(cat => (
                                        <button key={cat.id} onClick={() => setActiveCategory(cat.id)} className={`flex items-center gap-2 px-4 py-2 rounded-full text-sm font-medium border whitespace-nowrap ${activeCategory === cat.id ? 'bg-white text-black border-white' : 'bg-white/5 text-white/60 border-transparent hover:bg-white/10'}`}>
                                            {cat.icon} {cat.label}
                                        </button>
                                    ))}
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    {links.length === 0 ? (
                                        <div className={`col-span-full p-12 rounded-3xl border border-dashed flex flex-col items-center justify-center text-center gap-4 border-white/10 ${isDynamicTheme ? theme.glass : 'bg-slate-900/50'}`}>
                                            <div className="text-4xl opacity-50">💾</div>
                                            <p className="font-bold text-lg opacity-70">Lokal & Leer.</p>
                                            <p className="text-sm opacity-40">Füg deinen ersten Link hinzu, Jonas!</p>
                                        </div>
                                    ) : (
                                        filteredLinks.map(link => {
                                            const catInfo = categories.find(c => c.id === link.category) || categories[4];
                                            return (
                                                <a key={link.id} href={link.url} target="_blank" rel="noopener noreferrer" className={`group relative p-5 rounded-2xl border backdrop-blur-md shadow-lg transition-all duration-300 hover:-translate-y-1 flex flex-col justify-between min-h-[130px] ${isDynamicTheme ? theme.glass : 'bg-slate-900 border-slate-800 hover:bg-slate-800'}`}>
                                                    <div className={`absolute inset-0 opacity-0 group-hover:opacity-10 transition-opacity duration-500 bg-gradient-to-r ${currentMood === 'hype' ? 'from-pink-500 to-yellow-500' : 'from-white to-transparent'}`}></div>
                                                    <div className="flex justify-between items-start z-10">
                                                        <div className="pr-8">
                                                            <div className="flex items-center gap-2 mb-2">
                                                                <span className="text-[10px] uppercase tracking-wider font-bold px-2 py-0.5 rounded bg-white/10 text-white/70 flex items-center gap-1">{catInfo.icon} {catInfo.label}</span>
                                                            </div>
                                                            <h3 className="font-bold text-lg leading-tight text-white line-clamp-2">{link.title}</h3>
                                                        </div>
                                                        <Icons.ExternalLink className={`w-5 h-5 opacity-0 group-hover:opacity-100 transition-all ${theme.accent}`} />
                                                    </div>
                                                    <div className="flex justify-between items-end mt-4 z-10">
                                                        <div className="text-xs text-white/30 flex items-center gap-1"><Icons.Lock className="w-3 h-3"/> Lokal</div>
                                                        <button onClick={(e) => { e.preventDefault(); e.stopPropagation(); handleDelete(link.id); }} className="opacity-0 group-hover:opacity-100 p-2 hover:bg-red-500/20 rounded-lg text-white/20 hover:text-red-400 transition-all"><Icons.Trash2 className="w-4 h-4" /></button>
                                                    </div>
                                                </a>
                                            );
                                        })
                                    )}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
